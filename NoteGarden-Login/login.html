<!DOCTYPE html>
<html lang="PT-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login</title>
    <link rel="stylesheet" href="style.css">

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-EVSTQN3/azprG1Anm3QDgpJLIm9Nao0Yz1ztcQTwFspd3yD65VohhpuuCOmLASjC" crossorigin="anonymous">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/js/bootstrap.bundle.min.js" integrity="sha384-MrcW6ZMFYlzcLA8Nl+NtUVF0sA7MsXsP1UyJoMp4YLEuNSfAP+JcXn/tWtIaxVXM" crossorigin="anonymous"></script>

    <style>
        @import url('https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&display=swap');
    </style>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
    <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.7.1/jquery.min.js"></script>
    <script src="https://maxcdn.bootstrapcdn.com/bootstrap/3.4.1/js/bootstrap.min.js"></script>
</head>
<body>

    
    <div class="container-lg my-3" id="login-area">
        <div class="left-panel col-lg-7 ">
            <img src="img/Personagem_regando_planta-tela_de_login.png" alt="hominho" width="100%">
        </div>
        <div class="right-panel col-lg-5 col-sm-4">
            <div >
                <div class="row">
                    <div class="col-3" id="plantinha">
                        <div id="iconeplanta">
                            <img src="img/pixelart plant.gif " alt="iconeplanta">
                        </div>
                    </div>
                    <div class="col-9"  id="note-garden">
                        <h3 class="main-title">Note<br>Garden</h3>
                    </div>
                    <div class="col-10">
                        <h4 class="secondary-title">Crie sua conta!</h4>
                    </div>
                    
                    <div class="col-12">
                        <p class="about-text">Há sempre um novo jeito de ser mais organizado</p>
                    </div>
                    <div class="col-md-7">
                        <form action="" name="Login">
                                <label for="nomeComple" id="nomeCompleto">Nome Completo:</label><br>
                                <input type="text" id="nomeCompletoCaixa" placeholder="Nome Completo" maxlength="120"><br>
                                <label for="email" id="email">Email:</label><br>
                                <input type="text" id="emailCaixa" name="emailCaixa" placeholder="Digite seu e-mail" maxlength="60"><br>
                                <label for="senha" id="senha">Senha:</label><br>
                                <input type="password" id="senhaCaixa" name="senhaCaixa" placeholder="Digite sua senha"><br>
                                <a href="#">Esqueceu sua senha?</a><br>
                                <button class="btn my-5 btn-lg btn-outline-success">Criar</button><br>
                                Já tem uma conta?<a href="#"> Entrar</a>
                        </form>
                    </div>
                </div>
            </div>
        </div>

    </div>  
    <footer>
        <a href="https://storyset.com/idea">Idea illustrations by Storyset</a>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/@popperjs/core@2.9.2/dist/umd/popper.min.js" integrity="sha384-IQsoLXl5PILFhosVNubq5LC7Qb9DXgDA9i+tQ8Zj3iwWAwPtgFTxbJ8NT4GN1R8p" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/js/bootstrap.min.js" integrity="sha384-cVKIPhGWiC2Al4u+LWgxfKTRIcfu0JTxR+EQDz/bgldoEyl4H0zUF0QKbrJ0EcQF" crossorigin="anonymous"></script>
</body>
</html>
