<!DOCTYPE html>
    <!-- Doctype especifica a versão do HTML utilizada no documento -->
    <!-- O HTML tem variações, como XHTML, HTML 2.0, etc.. A versão atual é HTML:5 -->
<html lang="pt-br">
    <!-- especifica a linguagem da página -->
    <!-- Geralmente serve também para posicionar sua página nos mecanismos de pesquisa -->
<head>
    <link rel="stylesheet" href="style.css">
    <meta charset="UTF-8">
    <!-- "Charset" seria o codificador de carácteres, serve para incluir símbolos como "ç", "´", "¢"... -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Aula 1 - Site Boas Práticas em HTML">
    <title>Aula 1</title>
</head>
<body>
    <h1>Waves (2019)</h1>
    
    <div>
        <img src="img/waves movie poster.jpg" alt="Waves Movie Poster" width="250" height="350" class="center" >
    </div>
        <br>
    <div id="texto">
        A jornada emocional épica de uma família negra americana que tenta lidar com uma perda trágica que afeta profundamente as suas vidas, navegando através de sentimentos como amor, perdão e união.
    </div>
    <div>
        <input type="text" name="buscar" placeholder="Buscar filmes...">
        <input type="button" name="confirmar" value="Confirmar">
    </div>

    
</body>
</html>
